name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Lint only. `ruff format` is deliberately not enforced: the source is
      # hand-formatted in places where the formatter would be worse to read.
      - run: pipx install ruff==0.16.2
      - run: ruff check --output-format=github .

  api:
    name: API (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result of the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: apps/api
        run: pytest -v

      - name: Check that the suite left no database behind
        # The tests run against SQLite in memory. A database.db here would mean
        # something hit the real engine.
        working-directory: apps/api
        run: test ! -f database.db

  api-postgres:
    name: API against Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: halcyon
          POSTGRES_PASSWORD: halcyon
          POSTGRES_DB: halcyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halcyon -d halcyon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      # The suite itself runs on SQLite. This proves the migrations also apply
      # to the backend the compose stack actually deploys - the one where a
      # naive timestamp or a batch-mode-only ALTER would break.
      - name: Apply the migrations to Postgres
        working-directory: apps/api
        env:
          HALCYON_DATABASE_URL: postgresql+psycopg://halcyon:halcyon@127.0.0.1:5432/halcyon
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/cli/pyproject.toml

      - name: Install
        working-directory: apps/cli
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: apps/cli
        run: pytest -v

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Catches a malformed compose file or an unresolvable variable without
      # having to build the images.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
