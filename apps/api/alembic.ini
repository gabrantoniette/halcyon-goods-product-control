# Alembic configuration.
#
# There is deliberately no sqlalchemy.url here: env.py reads it from the same
# settings the app uses, so a migration can never be applied to a different
# database than the one the API talks to.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped filenames keep the revisions in chronological order on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
